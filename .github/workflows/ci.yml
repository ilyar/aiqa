name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'
          cache: true
      - run: make check
      - run: bash script/secret-screen.sh
      - run: bash script/install_test.sh
      - run: make security-check
      - run: make build VERSION=ci COMMIT="${GITHUB_SHA::12}" DATE=ci
      - run: ./bin/aiqa --version
      - run: make skill-check
      - run: make race
