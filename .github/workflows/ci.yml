name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
      - run: python3 -m pip install 'jsonschema==4.25.1'
      - run: make check
      - run: make build VERSION=ci COMMIT=${GITHUB_SHA::12} DATE=ci
      - run: ./bin/aiqa --version
      - run: make race
