# Project defaults. Existing settings are preserved by install.py.
# Current official schema: https://learn.chatgpt.com/docs/config-schema.json
model = "gpt-5.6-terra"
model_reasoning_effort = "low"

[agents]
enabled = true
max_concurrent_threads_per_session = 3
default_subagent_model = "gpt-5.6-terra"
default_subagent_reasoning_effort = "medium"

# Provider/auth, profiles, notify and otel belong in user configuration.
# No changes to the user's approval or sandbox policy are made here.
